# Serve ACME challenges before the first certificate is issued.
server_names_hash_bucket_size 64;

server {
    listen 80;
    listen [::]:80;
    server_name businessexperts.asia admin.businessexperts.asia analytics.businessexperts.asia api.businessexperts.asia;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 503;
    }
}
