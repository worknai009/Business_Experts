upstream be_asia_api { server be-backend:5000; keepalive 16; }
upstream be_asia_public { server be-frontend:80; keepalive 16; }
upstream be_asia_admin { server be-admin:80; keepalive 16; }
upstream be_asia_analytics { server be-analytics:80; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name businessexperts.asia admin.businessexperts.asia analytics.businessexperts.asia api.businessexperts.asia;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name businessexperts.asia;
    include /etc/nginx/conf.d/business-experts-tls.inc;
    include /etc/nginx/conf.d/business-experts-api.inc;
    location / {
        proxy_pass http://be_asia_public;
        include /etc/nginx/conf.d/business-experts-proxy.inc;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.businessexperts.asia;
    include /etc/nginx/conf.d/business-experts-tls.inc;
    include /etc/nginx/conf.d/business-experts-api.inc;
    location / {
        proxy_pass http://be_asia_admin;
        include /etc/nginx/conf.d/business-experts-proxy.inc;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name analytics.businessexperts.asia;
    include /etc/nginx/conf.d/business-experts-tls.inc;
    include /etc/nginx/conf.d/business-experts-api.inc;
    location / {
        proxy_pass http://be_asia_analytics;
        include /etc/nginx/conf.d/business-experts-proxy.inc;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.businessexperts.asia;
    include /etc/nginx/conf.d/business-experts-tls.inc;
    location / {
        proxy_pass http://be_asia_api;
        include /etc/nginx/conf.d/business-experts-proxy.inc;
    }
}
