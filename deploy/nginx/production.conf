server_names_hash_bucket_size 64;

upstream be_api { server 127.0.0.1:5000; keepalive 16; }
upstream be_public { server 127.0.0.1:5180; keepalive 16; }
upstream be_admin { server 127.0.0.1:5181; keepalive 16; }
upstream be_analytics { server 127.0.0.1:5173; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name businessexperts.asia admin.businessexperts.asia analytics.businessexperts.asia api.businessexperts.asia;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name businessexperts.asia;
    include /etc/nginx/snippets/be-tls.conf;
    include /etc/nginx/snippets/be-api.conf;
    location / {
        proxy_pass http://be_public;
        include /etc/nginx/snippets/be-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.businessexperts.asia;
    include /etc/nginx/snippets/be-tls.conf;
    include /etc/nginx/snippets/be-api.conf;
    location / {
        proxy_pass http://be_admin;
        include /etc/nginx/snippets/be-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name analytics.businessexperts.asia;
    include /etc/nginx/snippets/be-tls.conf;
    include /etc/nginx/snippets/be-api.conf;
    location / {
        proxy_pass http://be_analytics;
        include /etc/nginx/snippets/be-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.businessexperts.asia;
    include /etc/nginx/snippets/be-tls.conf;
    location / {
        proxy_pass http://be_api;
        include /etc/nginx/snippets/be-proxy.conf;
    }
}
